<!DOCTYPE html>
<html lang="pa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UDC / DDC ਸਹਾਇਕ</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 25px; border-radius: 12px; width: 100%; max-width: 580px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { margin-top: 0; text-align: center; color: #38bdf8; }
    input { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 16px; margin-bottom: 12px; }
    button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
    button:hover { background: #0369a1; }
    .output { margin-top: 20px; background: #0f172a; padding: 15px; border-radius: 8px; white-space: pre-wrap; font-family: monospace; font-size: 14px; border: 1px solid #334155; }
  </style>
</head>
<body>
  <div class="card">
    <h2>UDC / DDC ਕਲਾਸੀਫ਼ਿਕੇਸ਼ਨ ਸਹਾਇਕ</h2>
    <input type="text" id="queryInput" placeholder="ਕੋਈ ਵੀ ਵਿਸ਼ਾ ਜਾਂ ਕਿਤਾਬ ਦਾ ਨਾਂ ਲਿਖੋ (ਜਿਵੇਂ ਕਿ Physics, History)...">
    <button onclick="getAnswer()">ਸਹੀ ਕੋਡ ਲੱਭੋ</button>
    <div id="resultBox" class="output">ਜਵਾਬ ਇੱਥੇ ਦਿਖਾਈ ਦੇਵੇਗਾ...</div>
  </div>

  <script>
    async function getAnswer() {
      const q = document.getElementById('queryInput').value;
      const resBox = document.getElementById('resultBox');
      if (!q.trim()) return;

      resBox.innerText = "ਸਭ ਤੋਂ ਸਹੀ ਰਿਕਾਰਡ ਲੱਭੇ ਜਾ ਰਹੇ ਹਨ...";

      try {
        const response = await fetch('/api/classify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: q })
        });
        const data = await response.json();
        resBox.innerText = data.reply || data.error;
      } catch (err) {
        resBox.innerText = "ਗਲਤੀ: ਸਰਵਰ ਨਾਲ ਸੰਪਰਕ ਨਹੀਂ ਹੋ ਸਕਿਆ।";
      }
    }
  </script>
</body>
</html>
