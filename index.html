<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UDC Search Engine V28</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070b14;color:#eef3ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:980px;margin:auto;padding:20px}.card{background:#101827;border:1px solid #263957;border-radius:26px;padding:24px}
h1{margin:0;font-size:31px}.sub{color:#9ba9c1;margin:6px 0 22px}.search{display:flex;gap:10px}
input{flex:1;background:#070c16;border:2px solid #30476b;border-radius:18px;padding:18px;color:#fff;font-size:18px;outline:0}
button{border:0;border-radius:17px;padding:0 25px;background:#705cff;color:white;font-weight:800;font-size:16px;cursor:pointer}
button:disabled{opacity:.5}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}.chip{padding:9px 13px;background:#172236;border:1px solid #2b3d5b;border-radius:99px;cursor:pointer;color:#b9c6db}
#status{color:#9ba9c1;margin:16px 0}.result{background:#151d2c;border:1px solid #304263;border-radius:22px;padding:20px}
.udc{font-size:45px;font-weight:900;margin:8px 0;color:#7ea7ff}.badge{display:inline-block;padding:7px 10px;border-radius:99px;background:#1c3450;color:#8ed4ff;font-size:12px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.box{background:#0c1320;border:1px solid #263957;border-radius:15px;padding:14px}.box b{display:block;color:#8291aa;font-size:11px;letter-spacing:1px;margin-bottom:5px}.sources a{display:block;color:#75baff;margin:7px 0;word-break:break-all}
@media(max-width:650px){.search{flex-direction:column}.search button{height:56px}.grid{grid-template-columns:1fr}.udc{font-size:37px}}
</style></head>
<body><div class="wrap"><div class="card">
<h1>UDC Search Engine <span style="color:#8d79ff">V28</span></h1>
<div class="sub">Live UDC evidence search · Gemini FINAL · Groq research · No local 2700-title key</div>
<div class="search"><input id="q" placeholder="Enter book title, e.g. Education"><button id="go">SEARCH UDC</button></div>
<div class="chips">
<span class="chip">Education</span><span class="chip">English Drama</span><span class="chip">Hindi Language</span>
<span class="chip">History of India</span><span class="chip">Dictionary of Language and Literature</span>
</div><div id="status">Ready.</div><div id="out"></div>
</div></div>
<script>
const q=document.querySelector('#q'),go=document.querySelector('#go'),status=document.querySelector('#status'),out=document.querySelector('#out');
document.querySelectorAll('.chip').forEach(x=>x.onclick=()=>{q.value=x.textContent;run()});
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(r){
 if(!r?.verified||!r.udc){out.innerHTML='<div class="result"><b>NO VERIFIED UDC RESULT</b><p>'+esc(r?.message||'No defensible UDC number was found.')+'</p></div>';return}
 const src=(r.sources||[]).map(s=>'<a target="_blank" rel="noopener" href="'+esc(s.url)+'">'+esc(s.title||s.url)+'</a>').join('');
 out.innerHTML='<div class="result"><span class="badge">'+esc(r.providerStatus||'UDC RESULT')+'</span><div class="udc">'+esc(r.udc)+'</div>'+
 '<div class="grid"><div class="box"><b>TITLE</b>'+esc(r.title)+'</div><div class="box"><b>CONFIDENCE</b>'+esc(r.confidence)+'</div>'+
 '<div class="box"><b>MAIN SUBJECT</b>'+esc(r.mainSubject)+'</div><div class="box"><b>SUBJECT / FORM</b>'+esc(r.subSubject)+'</div></div>'+
 '<div class="box" style="margin-top:10px"><b>UDC BREAKDOWN</b>'+esc(r.explanation)+'</div>'+
 (src?'<div class="box sources" style="margin-top:10px"><b>EVIDENCE</b>'+src+'</div>':'')+'</div>'
}
async function run(){
 let title=q.value.trim();if(!title)return;go.disabled=true;status.textContent='Searching UDC evidence…';out.innerHTML='';
 try{let res=await fetch('/api/classify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({title})});let r=await res.json();status.textContent=r.providerStatus||'Complete';render(r)}
 catch(e){status.textContent='Temporary service problem';render({verified:false,message:'The search service is temporarily unavailable. No number was invented.'})}
 finally{go.disabled=false}
}
go.onclick=run;q.onkeydown=e=>{if(e.key==='Enter')run()}
</script></body></html>
