<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UDC Ultimate V7</title>
<style>
body{margin:0;background:#07101b;color:#f4f7fb;font-family:Arial,sans-serif}.wrap{max-width:920px;margin:auto;padding:22px}
.card{background:#101b29;border:1px solid #26384e;border-radius:20px;padding:22px;margin-bottom:18px;box-shadow:0 12px 35px #0005}
h1{margin:0 0 6px}.muted{color:#9aa9bd}.row{display:flex;gap:10px;margin-top:18px}input{flex:1;padding:17px;border-radius:14px;border:2px solid #31445d;background:#07101b;color:white;font-size:19px}button{border:0;border-radius:14px;padding:0 22px;font-weight:800;background:#7657ff;color:white;font-size:17px}
.udc{font-size:48px;font-weight:900;margin:10px 0}.subject{font-size:22px;font-weight:700}.grid{display:grid;grid-template-columns:180px 1fr;gap:13px;margin-top:20px}.lab{color:#9aa9bd;font-weight:700}.ok{color:#6ee7a0}.warn{color:#ffc66d}
.pill{display:inline-block;border:1px solid #38506d;border-radius:999px;padding:7px 10px;margin:2px}
@media(max-width:650px){.row{flex-direction:column}button{height:56px}.grid{grid-template-columns:1fr}.udc{font-size:38px}}
</style></head><body><div class="wrap">
<div class="card"><h1>📚 UDC Ultimate V7</h1><div class="muted">UNIVERSAL DECIMAL CLASSIFICATION · UDC ONLY · NEVER DDC · WHOLE-WORD + CONTEXT MATCHING</div>
<div class="row"><input id="title" placeholder="Enter book title or question"><button onclick="go()">CLASSIFY</button></div>
<div class="muted" style="margin-top:12px">Try: Heart Disease · What is the UDC number for heart disease? · Science and Arts · Science and Technology · Hindi language · History of India</div></div>
<div id="out"></div></div>
<script>
async function go(){let title=document.getElementById("title").value.trim();if(!title)return;
let o=document.getElementById("out");o.innerHTML='<div class="card">Classifying…</div>';
try{let r=await fetch("/api/classify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title})}).then(x=>x.json());
let aux=(r.aux||[]).map(a=>`<span class="pill">${esc(a.code)} — ${esc(a.name)}</span>`).join("");
o.innerHTML=`<div class="card"><div class="${r.verifiedRule?"ok":"warn"}">${r.verifiedRule?"✓ VERIFIED LOCAL RULE MATCH":"⚠ REVIEW REQUIRED"}</div>
<div class="udc">${esc(r.udc||"REVIEW")}</div><div class="subject">${esc(r.subject)}</div>
<div class="grid"><div class="lab">Book / Question</div><div>${esc(r.bookTitle)}</div>
<div class="lab">Main Subject</div><div>${esc(r.mainSubject)}</div><div class="lab">Sub Subject</div><div>${esc(r.subSubject)}</div>
<div class="lab">Notation</div><div>${esc(r.explanation)}</div><div class="lab">Auxiliaries</div><div>${aux||"—"}</div>
<div class="lab">Confidence</div><div>${esc(r.confidence)}</div></div></div>`;
}catch(e){o.innerHTML='<div class="card warn">Server error — check Render logs.</div>'}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
document.getElementById("title").addEventListener("keydown",e=>{if(e.key==="Enter")go()});
</script></body></html>
