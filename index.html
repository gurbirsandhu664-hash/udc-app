<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Classification & Reading Engine</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #1e293b; padding: 20px; max-width: 600px; margin: 0 auto; }
    .card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
    label { font-weight: bold; font-size: 14px; display: block; margin-bottom: 8px; color: #475569; }
    input[type="text"] { width: 100%; padding: 14px; font-size: 16px; border: 1px solid #cbd5e1; border-radius: 10px; box-sizing: border-box; margin-bottom: 15px; }
    .btn-classify { background: linear-gradient(to right, #4f46e5, #3b82f6); color: white; padding: 14px 20px; font-size: 16px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; width: 100%; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .btn-classify:hover { opacity: 0.9; }
    .output-box { background: #f1f5f9; padding: 15px; border-radius: 10px; margin-top: 10px; font-size: 15px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>📚 World-Class Library Engine</h2>
    
    <!-- 🖊️ ਟਾਈਟਲ ਇਨਪੁਟ ਬਾਕਸ (Title Input Box) -->
    <div style="margin-bottom: 15px;">
      <label for="title-input">Book Title</label>
      <input type="text" id="title-input" placeholder="Enter book title (e.g., History of Sikhism)...">
    </div>

    <!-- ⚡ ਕਲਾਸੀਫਾਈ ਬਟਨ -->
    <button id="classify-btn" class="btn-classify">⚡ CLASSIFY</button>

    <!-- 🔊 AI ਰੀਡਿੰਗ ਇੰਜਣ ਬਾਕਸ -->
    <div id="reading-engine-box" style="margin-top: 20px; padding: 15px; background: #f0fdf4; border: 1px solid #10b981; border-radius: 12px; display: flex; align-items: center; justify-content: space-between;">
      <div>
        <strong style="color: #065f46; font-size: 14px;">🔊 AI Reading Engine</strong>
        <p style="margin: 2px 0 0 0; font-size: 12px; color: #047857;">Auto-reads the title and classification result aloud.</p>
      </div>
      <button id="speak-result-btn" style="background-color: #10b981; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer;">
        🎙️ Read Aloud
      </button>
    </div>
  </div>

  <!-- 📊 ਨਤੀਜੇ ਦਿਖਾਉਣ ਲਈ ਬਾਕਸ -->
  <div class="card" id="result-card" style="display:none;">
    <h3>Classification Result</h3>
    <div class="output-box">
      <p><strong>UDC Notation:</strong> <span id="udc-output">-</span></p>
      <p><strong>DDC Answer:</strong> <span id="ddc-output">-</span></p>
      <p><strong>Main Subject:</strong> <span id="subject-output">-</span></p>
    </div>
  </div>

  <script>
    document.getElementById('classify-btn').addEventListener('click', async () => {
      const title = document.getElementById('title-input').value.trim();
      if (!title) { alert('Please enter a book title.'); return; }

      try {
        const response = await fetch('/api/classify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title })
        });
        const data = await response.json();
        
        if (data.status === 'classified') {
          document.getElementById('udc-output').innerText = data.udc_number;
          document.getElementById('ddc-output').innerText = data.ddc_number;
          document.getElementById('subject-output').innerText = data.main_subject;
          document.getElementById('result-card').style.display = 'block';
        } else {
          alert('Classification failed.');
        }
      } catch (e) {
        alert('Server error.');
      }
    });

    // Speech Synthesis Reading Engine
    document.getElementById('speak-result-btn').addEventListener('click', () => {
      const titleText = document.getElementById('title-input').value || "Current Book";
      const ddcText = document.getElementById('ddc-output').innerText || "025.4";
      const udcText = document.getElementById('udc-output').innerText || "025.4";

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const textToSpeech = `Book title: ${titleText}. Dewey Decimal Classification number is ${ddcText}. Universal Decimal Classification number is ${udcText}.`;
        const utterance = new SpeechSynthesisUtterance(textToSpeech);
        utterance.rate = 0.95;
        window.speechSynthesis.speak(utterance);
      } else {
        alert('Speech synthesis not supported.');
      }
    });
  </script>

</body>
</html>
