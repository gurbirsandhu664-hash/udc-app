<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UDC Abridged · Master Fix</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#10233d}
.wrap{max-width:900px;margin:auto;padding:28px 18px}
header{display:flex;justify-content:space-between;align-items:center;background:white;padding:22px;border-radius:20px;box-shadow:0 8px 30px #0001}
h1{margin:0;font-size:28px}.sub{color:#708197;margin-top:5px}
.card{background:white;border-radius:20px;padding:24px;margin-top:20px;box-shadow:0 8px 30px #0001}
.row{display:flex;gap:12px}.row input{flex:1}
input{font-size:20px;padding:18px;border:2px solid #d5dfeb;border-radius:16px;box-sizing:border-box}
button{border:0;border-radius:16px;background:#173354;color:white;padding:0 25px;font-size:17px;font-weight:700}
.result{border-left:6px solid #173354}.udc{font-size:42px;font-weight:800;margin:12px 0}.pill{display:inline-block;background:#e8f5ea;color:#26733c;padding:8px 13px;border-radius:999px;font-weight:700}
.label{font-weight:700;color:#607188;margin-top:14px}.value{font-size:19px;margin-top:5px;line-height:1.45}
.warn{background:#fff5db;color:#795600;padding:12px;border-radius:12px;margin-top:16px}
@media(max-width:650px){.row{flex-direction:column}.row button{height:58px}.udc{font-size:34px}}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>📖 UDC Abridged</h1><div class="sub">UDC only · Never DDC · Master Fix</div></div><strong>AI Classifier</strong></header>
<div class="card">
<div class="label">ENTER BOOK TITLE</div>
<div class="row" style="margin-top:10px"><input id="title" placeholder="e.g. Hindi language"><button onclick="go()">CLASSIFY</button></div>
<div class="sub" style="margin-top:12px">Examples: Science and Arts · Science and Technology · Hindi language · History of India</div>
</div>
<div id="out"></div>
</div>
<script>
async function go(){
 const title=document.getElementById("title").value.trim();
 if(!title)return;
 const out=document.getElementById("out");
 out.innerHTML='<div class="card">Classifying…</div>';
 try{
   const r=await fetch('/api/classify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title})});
   const d=await r.json();
   out.innerHTML=`<div class="card result">
     <div><span class="pill">${d.verifiedRule?'✓ CLASSIFIED':'⚠ REVIEW REQUIRED'}</span></div>
     <h2>${esc(d.title)}</h2>
     <div class="label">FINAL UDC NUMBER</div><div class="udc">${esc(d.udc)}</div>
     <div class="label">MAIN SUBJECT</div><div class="value">${esc(d.subject)}</div>
     <div class="label">SUB SUBJECT</div><div class="value">${esc(d.subSubject)}</div>
     <div class="label">NOTATION BREAKDOWN / EXPLANATION</div><div class="value">${esc(d.explanation)}</div>
     <div class="label">CONFIDENCE</div><div class="value">${esc(d.confidence)}</div>
     ${d.aux?.length?'<div class="label">AUXILIARY / COMPONENTS</div><div class="value">'+d.aux.map(x=>esc(x.code+' — '+x.name)).join('<br>')+'</div>':''}
     ${!d.verifiedRule?'<div class="warn">This is intentionally not shown as a verified UDC answer. Check the authoritative UDC source for an exact match.</div>':''}
   </div>`;
 }catch(e){out.innerHTML='<div class="card warn">Server error. Check Render deployment logs.</div>'}
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById("title").addEventListener("keydown",e=>{if(e.key==="Enter")go()});
</script>
</body>
</html>
