<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0d16">
<title>UDC One-Click V33</title>
<style>
:root{--bg:#070a11;--card:#101624;--line:#273650;--text:#f5f7ff;--muted:#9eabc4;--a:#6f5cff;--b:#48b9e9;--ok:#54d98a;--warn:#ffbd55}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17122d 0,#070a11 38%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:820px;margin:auto;padding:28px 16px 60px}.hero,.result,.panel{background:rgba(16,22,36,.94);border:1px solid var(--line);border-radius:28px;box-shadow:0 18px 60px rgba(0,0,0,.3)}
.hero{padding:28px}.brand{font-size:42px;font-weight:800;letter-spacing:-1.5px}.ver{color:#927cff}.sub{color:var(--muted);font-size:18px;margin:8px 0 24px}
textarea{width:100%;min-height:100px;background:#050810;color:#fff;border:2px solid #334b76;border-radius:22px;padding:20px;font-size:20px;resize:vertical;outline:none}
button{width:100%;border:0;border-radius:20px;padding:19px;margin-top:14px;background:linear-gradient(100deg,var(--a),var(--b));color:#fff;font-size:20px;font-weight:800;cursor:pointer}
button:disabled{opacity:.6}.chips{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.chip{width:auto;margin:0;padding:10px 15px;border:1px solid #304260;background:#141c2d;font-size:15px}
.status{margin:18px 0;color:var(--muted)}.result{padding:24px;margin-top:18px}.label{font-size:12px;letter-spacing:3px;color:var(--muted);font-weight:800}.udc{font-size:58px;font-weight:900;color:#86a9ff;margin:8px 0}.badge{display:inline-block;border:1px solid var(--ok);color:var(--ok);border-radius:999px;padding:8px 12px;font-weight:800}.warning{border-color:var(--warn);color:var(--warn)}.field{background:#080d17;border:1px solid #263652;border-radius:18px;padding:17px;margin-top:12px}.field b{display:block;color:var(--muted);font-size:12px;letter-spacing:2px;margin-bottom:8px}.small{color:var(--muted);font-size:13px;line-height:1.55}.panel{padding:20px;margin-top:18px}.sources a{color:#9ec7ff;display:block;margin:8px 0;text-decoration:none}.spin{display:inline-block;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}} 
</style>
</head>
<body><main class="wrap">
<section class="hero">
<div class="brand">UDC One-Click <span class="ver">V33</span></div>
<div class="sub">UDC ONLY · Gemini FINAL · Google Search grounding · Groq research-only · no invented 0</div>
<textarea id="title" placeholder="Enter any book title… e.g. History of India"></textarea>
<button id="go" onclick="classify()">⚡ CLASSIFY IN ONE CLICK</button>
<div class="chips">
<button class="chip" onclick="useTitle('History of India')">History of India</button>
<button class="chip" onclick="useTitle('Education')">Education</button>
<button class="chip" onclick="useTitle('English Drama')">English Drama</button>
<button class="chip" onclick="useTitle('Bible in Hindi')">Bible in Hindi</button>
<button class="chip" onclick="useTitle('Dictionary of Language and Literature')">Dictionary of Language and Literature</button>
</div>
<div id="status" class="status">Ready.</div>
</section>
<div id="out"></div>
<section class="panel"><div class="label">ENGINE STATUS</div><div id="engine" class="small">Loading…</div></section>
</main>
<script>
const $=id=>document.getElementById(id);
function useTitle(t){$("title").value=t;$("title").focus()}
async function classify(){
  const title=$("title").value.trim(); if(!title){$("status").textContent="Enter a book title.";return}
  $("go").disabled=true;$("status").innerHTML='<span class="spin">◌</span> Checking supplied data → Gemini → Google Search…';$("out").innerHTML="";
  try{
    const r=await fetch("/api/classify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title})});
    const d=await r.json();
    if(d.status==="classified" && d.udc_number){
      $("status").textContent="Verified classification returned.";
      $("out").innerHTML=`<section class="result"><div class="label">UDC CLASSIFICATION</div><div class="udc">${esc(d.udc_number)}</div><span class="badge">✓ ${esc(d.provider)}</span>
      ${field("BOOK TITLE",d.title)}${field("CONFIDENCE",d.confidence)}${field("MAIN SUBJECT",d.main_subject)}${field("SUB SUBJECT",d.sub_subject||"—")}${field("EXPLANATION",d.explanation)}
      <div class="small" style="margin-top:14px">${esc(d.note||"")}</div>${sources(d.citations)}</section>`;
    }else{
      $("status").textContent="Verification required.";
      $("out").innerHTML=`<section class="result"><div class="label">NO VERIFIED UDC RESULT</div><div class="udc">—</div><span class="badge warning">⚠ VERIFICATION REQUIRED</span>
      ${field("BOOK TITLE",d.title)}${field("STATUS",d.explanation||"No defensible UDC number was verified.")}<div class="small">No guessed number and no 0 placeholder was used.</div></section>`;
    }
  }catch(e){$("status").textContent="Temporary server error. Try again."; $("out").innerHTML=`<section class="result"><span class="badge warning">SERVER ERROR</span>${field("DETAIL",e.message)}</section>`}
  finally{$("go").disabled=false}
}
function field(k,v){return `<div class="field"><b>${esc(k)}</b>${esc(v||"—")}</div>`}
function sources(a){if(!a?.length)return"";return `<div class="field sources"><b>GROUNDING SOURCES</b>${a.map(x=>`<a href="${escAttr(x.uri)}" target="_blank" rel="noopener">${esc(x.title||x.uri)}</a>`).join("")}</div>`}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function escAttr(s){return esc(s)}
async function loadStatus(){try{const d=await (await fetch("/api/status")).json();$("engine").textContent=`Final: ${d.finalProvider} · Google grounding: ${d.googleSearchGrounding?"ON":"OFF"} · Groq: ${d.groqRole} · Imported classes: ${d.importedClassCount}`;}catch{$("engine").textContent="Status unavailable."}}
loadStatus();
$("title").addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key==="Enter")classify()});
</script></body></html>
