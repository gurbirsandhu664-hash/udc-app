<!-- World-Class Reading Engine (Text-to-Speech & Audio Readout) -->
<div id="reading-engine-box" style="margin-top: 15px; padding: 15px; background: #f0fdf4; border: 1px solid #10b981; border-radius: 12px; display: flex; align-items: center; justify-content: space-between;">
  <div>
    <strong style="color: #065f46; font-size: 14px;">🔊 AI Reading Engine</strong>
    <p style="margin: 2px 0 0 0; font-size: 12px; color: #047857;">Auto-reads the title and classification result aloud.</p>
  </div>
  <button id="speak-result-btn" style="background-color: #10b981; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px;">
    🎙️ Read Aloud
  </button>
</div>

<script>
  // World-Class Speech Synthesis Reading Engine
  function speakClassificationResult(title, ddc, udc) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel(); // Stop any ongoing speech
      const textToSpeech = `Book title: ${title}. Dewey Decimal Classification number is ${ddc}. Universal Decimal Classification number is ${udc}.`;
      const utterance = new SpeechSynthesisUtterance(textToSpeech);
      utterance.rate = 0.95; // Professional reading speed
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    } else {
      alert('Speech synthesis is not supported in this browser.');
    }
  }

  // Hook up with the result render
  document.getElementById('speak-result-btn').addEventListener('click', () => {
    const titleText = document.getElementById('title-input')?.value || "Current Book";
    const ddcText = document.getElementById('ddc-output')?.innerText || "025.4";
    const udcText = document.getElementById('udc-output')?.innerText || "025.4";
    speakClassificationResult(titleText, ddcText, udcText);
  });
</script>
