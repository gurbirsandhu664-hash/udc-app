<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b14">
<title>UDC Master Search V36</title>
<style>
:root{--bg:#070a12;--card:#101726;--card2:#0b111d;--line:#2b3d60;--text:#f7f9ff;--muted:#9aa9c4;--a:#735cf6;--b:#49bce8;--ok:#61df95;--warn:#ffc35c;--bad:#ff7d88}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(900px 500px at 50% -80px,#211848 0,#0a0d16 58%,#060910 100%);min-height:100vh}
.wrap{max-width:880px;margin:auto;padding:22px 14px 60px}.hero,.result,.panel{background:rgba(16,23,38,.95);border:1px solid var(--line);border-radius:30px;box-shadow:0 20px 70px rgba(0,0,0,.35)}.hero{padding:26px}.brand{font-size:clamp(35px,8vw,58px);line-height:1;font-weight:900;letter-spacing:-2px}.ver{color:#927bff}.tag{display:inline-flex;margin-top:14px;padding:8px 12px;border:1px solid #41557d;border-radius:999px;color:#c8d3e9;background:#10192a;font-weight:800;font-size:12px;letter-spacing:1px}.sub{color:var(--muted);font-size:17px;line-height:1.5;margin:12px 0 22px}
textarea{width:100%;min-height:112px;background:#050812;color:#fff;border:2px solid #3a5486;border-radius:22px;padding:19px;font-size:20px;line-height:1.45;resize:vertical;outline:none}textarea:focus{border-color:#8a72ff;box-shadow:0 0 0 4px rgba(115,92,246,.12)}
button{border:0;border-radius:20px;padding:18px 20px;background:linear-gradient(100deg,var(--a),var(--b));color:#fff;font-size:19px;font-weight:900;cursor:pointer;box-shadow:0 12px 30px rgba(91,92,230,.18)}button:disabled{opacity:.55;cursor:wait}.mainbtn{width:100%;margin-top:13px}.chips{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.chip{width:auto;margin:0;padding:10px 14px;border:1px solid #304464;background:#141d30;font-size:14px;box-shadow:none}.status{margin:17px 2px 0;color:var(--muted);min-height:22px}.status.ok{color:var(--ok)}.status.warn{color:var(--warn)}.spin{display:inline-block;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
.result{padding:23px;margin-top:18px}.resulthead{display:flex;align-items:center;justify-content:space-between;gap:12px}.label{font-size:12px;letter-spacing:3px;color:var(--muted);font-weight:900}.udc{font-size:clamp(46px,12vw,78px);font-weight:950;color:#8eafff;letter-spacing:-2px;margin:8px 0}.badge{display:inline-flex;border:1px solid var(--ok);color:var(--ok);border-radius:999px;padding:8px 12px;font-weight:900;font-size:13px}.warning{border-color:var(--warn);color:var(--warn)}.field{background:var(--card2);border:1px solid #263958;border-radius:18px;padding:16px;margin-top:12px}.field b{display:block;color:var(--muted);font-size:11px;letter-spacing:2px;margin-bottom:8px}.value{font-size:16px;line-height:1.55}.small{color:var(--muted);font-size:13px;line-height:1.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.sources a{color:#a9ccff;display:block;margin:9px 0;text-decoration:none;overflow-wrap:anywhere}.sources a:hover{text-decoration:underline}.query{padding:7px 10px;background:#0d1524;border-radius:10px;margin:6px 0;color:#c4d0e6}.panel{padding:19px;margin-top:18px}.enginegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.stat{padding:13px;background:#0b111d;border:1px solid #243552;border-radius:15px}.stat strong{display:block;font-size:12px;color:var(--muted);letter-spacing:1px;margin-bottom:5px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}.dot.off{background:var(--warn)}
@media(max-width:620px){.grid,.enginegrid{grid-template-columns:1fr}.hero{padding:21px}.result{padding:19px}}
</style>
</head>
<body><main class="wrap">
<section class="hero">
  <div class="brand">UDC Master Search <span class="ver">V36</span></div>
  <div class="tag">UDC ONLY · GEMINI FINAL · GOOGLE SEARCH GROUNDING</div>
  <div class="sub">Evidence-first classification engine. Gemini produces the final UDC answer; Groq is research-only. No DDC, no invented 0, no guessed placeholder.</div>
  <textarea id="title" autocomplete="off" placeholder="Enter any book title… e.g. History of India"></textarea>
  <button id="go" class="mainbtn" onclick="classify()">⚡ SEARCH &amp; CLASSIFY</button>
  <div class="chips">
    <button class="chip" onclick="useTitle('History of India')">History of India</button>
    <button class="chip" onclick="useTitle('Education')">Education</button>
    <button class="chip" onclick="useTitle('English Drama')">English Drama</button>
    <button class="chip" onclick="useTitle('Bible in Hindi')">Bible in Hindi</button>
    <button class="chip" onclick="useTitle('Dictionary of Language and Literature')">Dictionary of Language and Literature</button>
  </div>
  <div id="status" class="status">Ready — enter a title and search.</div>
</section>
<div id="out"></div>
<section class="panel"><div class="label">ENGINE STATUS</div><div class="enginegrid" id="engine"><div class="stat">Loading…</div></div></section>
</main>
<script>
const $=id=>document.getElementById(id);
function useTitle(t){$("title").value=t;$("title").focus()}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function escAttr(s){return esc(s)}
function field(k,v){return `<div class="field"><b>${esc(k)}</b><div class="value">${esc(v||"—")}</div></div>`}
function sources(a){if(!a?.length)return"";return `<div class="field sources"><b>GOOGLE EVIDENCE</b>${a.map((x,i)=>`<a href="${escAttr(x.uri)}" target="_blank" rel="noopener noreferrer">${i+1}. ${esc(x.title||x.uri)}</a>`).join("")}</div>`}
function queries(a){if(!a?.length)return"";return `<div class="field"><b>SEARCH QUERIES USED</b>${a.map(q=>`<div class="query">${esc(q)}</div>`).join("")}</div>`}
async function classify(){
  const title=$("title").value.trim();
  if(!title){$("status").textContent="Enter a book title first.";$("status").className="status warn";return}
  const btn=$("go");btn.disabled=true;$("status").className="status";$("status").innerHTML='<span class="spin">◌</span> Searching UDC evidence → Gemini final verification…';$("out").innerHTML="";
  try{
    const r=await fetch("/api/classify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title})});
    const d=await r.json();
    if(d.status==="classified" && d.udc_number){
      $("status").textContent="Gemini final classification returned.";$("status").className="status ok";
      $("out").innerHTML=`<section class="result"><div class="resulthead"><div class="label">VERIFIED UDC CLASSIFICATION</div><span class="badge">✓ GEMINI FINAL</span></div><div class="udc">${esc(d.udc_number)}</div>
      <div class="grid">${field("BOOK TITLE",d.title)}${field("CONFIDENCE",d.confidence)}${field("MAIN SUBJECT",d.main_subject)}${field("SUB SUBJECT",d.sub_subject||"—")}</div>${field("EXPLANATION",d.explanation)}${queries(d.searchQueries)}${sources(d.citations)}<div class="small" style="margin-top:14px">${esc(d.note||"")}</div></section>`;
    }else{
      $("status").textContent=d.error_code==="GEMINI_KEY_MISSING"?"Gemini key is missing.":"No defensible UDC classification was verified.";$("status").className="status warn";
      $("out").innerHTML=`<section class="result"><div class="label">VERIFICATION STATUS</div><div class="udc">—</div><span class="badge warning">⚠ ${esc(d.error_code||"UNVERIFIED")}</span>${field("BOOK TITLE",d.title)}${field("STATUS",d.explanation||"No defensible UDC number was verified.")}${queries(d.searchQueries)}${sources(d.citations)}<div class="small" style="margin-top:14px">The engine deliberately does not invent a UDC number or substitute 0.</div></section>`;
    }
  }catch(e){
    $("status").textContent="Connection error — try again.";$("status").className="status warn";
    $("out").innerHTML=`<section class="result"><div class="label">TEMPORARY ERROR</div><span class="badge warning">SERVER / NETWORK</span>${field("DETAIL",e.message||"Request failed")}</section>`;
  }finally{btn.disabled=false}
}
async function loadStatus(){try{const d=await (await fetch("/api/status")).json();$("engine").innerHTML=`<div class="stat"><strong>FINAL AI</strong><span class="dot"></span>${esc(d.finalProvider)}</div><div class="stat"><strong>GOOGLE GROUNDING</strong><span class="dot"></span>${d.googleSearchGrounding?"ON":"OFF"}</div><div class="stat"><strong>GROQ</strong><span class="dot"></span>Research only</div><div class="stat"><strong>LOCAL DATA</strong>${esc(d.recordsInMemory)} starter records${d.licensedDatasetLoaded?" · imported/licensed loaded":" · no MRF loaded"}</div>`}catch{$("engine").innerHTML='<div class="stat">Status unavailable.</div>'}}
loadStatus();$("title").addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key==="Enter")classify()});
</script></body></html>
