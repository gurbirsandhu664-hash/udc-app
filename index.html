<!DOCTYPE html>
<html lang="pa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UDC & DDC Library Classifier</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #f0f4f8;
      color: #333;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: #ffffff;
      width: 100%;
      max-width: 550px;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }
    h1 {
      font-size: 24px;
      color: #1a365d;
      margin-bottom: 8px;
      text-align: center;
    }
    p.subtitle {
      font-size: 14px;
      color: #718096;
      text-align: center;
      margin-bottom: 16px;
    }
    .badge {
      display: inline-block;
      background: #e2e8f0;
      color: #2b6cb0;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 8px;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 1.5px solid #cbd5e0;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #3182ce;
    }
    button {
      width: 100%;
      background: #3182ce;
      color: #ffffff;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 6px;
    }
    button:disabled {
      background: #a0aec0;
      cursor: not-allowed;
    }
    .result-box {
      margin-top: 24px;
      display: none;
    }
    .card {
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .card h3 {
      font-size: 16px;
      color: #2b6cb0;
      margin-bottom: 8px;
    }
    .field {
      font-size: 14px;
      margin-bottom: 6px;
    }
    .field strong {
      color: #4a5568;
    }
    .error-box {
      background: #fff5f5;
      color: #c53030;
      border: 1px solid #feb2b2;
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      font-size: 14px;
      display: none;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>UDC & DDC Classifier</h1>
    <p class="subtitle">ਲਾਈਬ੍ਰੇਰੀ ਕਿਤਾਬਾਂ ਦਾ ਆਟੋਮੈਟਿਕ ਵਰਗੀਕਰਨ</p>

    <div style="text-align: center;">
      <span class="badge">Powered by Gemini 2.5 Flash</span>
    </div>

    <form id="classifyForm">
      <div class="form-group">
        <label for="titleInput">ਕਿਤਾਬ ਦਾ ਨਾਮ (Book Title) *</label>
        <input type="text" id="titleInput" placeholder="ਜਿਵੇਂ: History of india" required autocomplete="off">
      </div>

      <button type="submit" id="classifyBtn">Classify</button>
    </form>

    <div id="errorBox" class="error-box"></div>

    <div id="resultBox" class="result-box">
      <div class="card">
        <h3>Dewey Decimal Classification (DDC)</h3>
        <div class="field"><strong>ਨੰਬਰ:</strong> <span id="ddcNumber">-</span></div>
        <div class="field"><strong>ਸਿਰਲੇਖ:</strong> <span id="ddcHeading">-</span></div>
        <div class="field"><strong>ਭਰੋਸੇਯੋਗਤਾ:</strong> <span id="ddcConfidence">-</span></div>
      </div>

      <div class="card">
        <h3>Universal Decimal Classification (UDC)</h3>
        <div class="field"><strong>ਨੰਬਰ:</strong> <span id="udcNumber">-</span></div>
        <div class="field"><strong>ਸਿਰਲੇਖ:</strong> <span id="udcHeading">-</span></div>
        <div class="field"><strong>ਭਰੋਸੇਯੋਗਤਾ:</strong> <span id="udcConfidence">-</span></div>
      </div>

      <div class="card" style="background:#edf2f7;">
        <h3>ਵੇਰਵਾ / ਸੰਖੇਪ (Summary)</h3>
        <p id="summaryText" style="font-size: 14px; color: #4a5568; line-height: 1.5;">-</p>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('classifyForm');
    const classifyBtn = document.getElementById('classifyBtn');
    const titleInput = document.getElementById('titleInput');
    const resultBox = document.getElementById('resultBox');
    const errorBox = document.getElementById('errorBox');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const title = titleInput.value.trim();
      if (!title) return;

      errorBox.style.display = 'none';
      resultBox.style.display = 'none';
      classifyBtn.disabled = true;
      classifyBtn.innerText = 'ਵਰਗੀਕਰਨ ਕੀਤਾ ਜਾ ਰਿਹਾ ਹੈ...';

      try {
        const response = await fetch('/api/classify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title })
        });

        const resData = await response.json();

        if (!response.ok || !resData.success) {
          throw new Error(resData.error || (resData.details ? resData.details : 'ਸਰਵਰ ਵੱਲੋਂ ਜਵਾਬ ਨਹੀਂ ਮਿਲਿਆ'));
        }

        const data = resData.data;

        document.getElementById('ddcNumber').innerText = data.ddc?.number || 'N/A';
        document.getElementById('ddcHeading').innerText = data.ddc?.heading || 'N/A';
        document.getElementById('ddcConfidence').innerText = data.ddc?.confidence || 'High';

        document.getElementById('udcNumber').innerText = data.udc?.number || 'N/A';
        document.getElementById('udcHeading').innerText = data.udc?.heading || 'N/A';
        document.getElementById('udcConfidence').innerText = data.udc?.confidence || 'High';

        document.getElementById('summaryText').innerText = data.summary || 'ਕੋਈ ਵੇਰਵਾ ਉਪਲਬਧ ਨਹੀਂ ਹੈ।';

        resultBox.style.display = 'block';
      } catch (err) {
        errorBox.innerText = 'ਗਲਤੀ: ' + err.message;
        errorBox.style.display = 'block';
      } finally {
        classifyBtn.disabled = false;
        classifyBtn.innerText = 'Classify';
      }
    });
  </script>
</body>
</html>
