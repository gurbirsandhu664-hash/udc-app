<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UDC (1961) + DDC (23) Dual Classifier</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 650px; display: flex; flex-direction: column; gap: 16px; }
    .header { text-align: center; margin-bottom: 8px; }
    .header h1 { font-size: 1.5rem; font-weight: 800; color: #1e293b; }
    .header p { font-size: 0.85rem; color: #64748b; margin-top: 4px; }
    .input-box { background: var(--card); padding: 16px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
    textarea { width: 100%; border: 1.5px solid #cbd5e1; border-radius: 10px; padding: 12px; font-size: 0.95rem; resize: none; outline: none; }
    textarea:focus { border-color: var(--primary); }
    button { background: var(--primary); color: #fff; font-weight: 700; border: none; padding: 14px; border-radius: 10px; cursor: pointer; font-size: 1rem; transition: background 0.2s; }
    button:hover { background: #1d4ed8; }
    .result-card { background: var(--card); border-radius: 20px; border: 1px solid var(--border); padding: 20px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); display: none; flex-direction: column; gap: 14px; }
    .badges { display: flex; gap: 8px; }
    .badge { background: #eff6ff; color: #1d4ed8; font-weight: 700; font-size: 0.7rem; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; }
    .number-box { background: #f1f5f9; border-radius: 12px; padding: 14px; margin-top: 4px; }
    .number-title { font-size: 0.75rem; font-weight: 800; color: #475569; text-transform: uppercase; letter-spacing: 0.5px; }
    .number-value { font-size: 1.6rem; font-weight: 900; color: #0f172a; margin-top: 4px; word-break: break-all; }
    .item { background: #f8fafc; padding: 12px; border-radius: 10px; border: 1px solid #f1f5f9; }
    .item-label { font-size: 0.7rem; font-weight: 800; color: #64748b; text-transform: uppercase; }
    .item-value { font-size: 0.9rem; font-weight: 600; color: #1e293b; margin-top: 4px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>UDC + DDC DUAL CLASSIFIER</h1>
    <p>BS 1000A:1961 & Dewey Decimal Classification (23rd Ed.)</p>
  </div>

  <div class="input-box">
    <textarea id="titleInput" rows="3" placeholder="Enter book or document title here..."></textarea>
    <button id="classifyBtn" onclick="classify()">CLASSIFY NOW</button>
  </div>

  <div id="resultCard" class="result-card">
    <div class="badges">
      <span class="badge">BS 1000A:1961</span>
      <span class="badge">DDC 23rd EDITION</span>
    </div>

    <div>
      <div class="item-label">Full Title Recognized</div>
      <div id="recognizedTitle" style="font-weight: 800; font-size: 1.1rem; margin-top: 2px;"></div>
    </div>

    <div class="number-box" style="border-left: 5px solid #2563eb;">
      <div class="number-title">Complete UDC Answer (1961)</div>
      <div id="udcValue" class="number-value"></div>
      <div id="udcBreakdown" style="font-size: 0.8rem; color: #475569; margin-top: 6px;"></div>
    </div>

    <div class="number-box" style="border-left: 5px solid #059669;">
      <div class="number-title">Complete DDC Answer (Edition 23)</div>
      <div id="ddcValue" class="number-value" style="color: #065f46;"></div>
      <div id="ddcBreakdown" style="font-size: 0.8rem; color: #047857; margin-top: 6px;"></div>
    </div>

    <div class="item">
      <div class="item-label">Main Discipline</div>
      <div id="mainSubject" class="item-value"></div>
    </div>

    <div class="item">
      <div class="item-label">Verification Standard</div>
      <div class="item-value" style="color: #059669;">✓ Schedule Verified (No Truncation)</div>
    </div>
  </div>
</div>

<script>
  function clientSideRuleEngine(rawTitle) {
    var t = (rawTitle || '').toLowerCase().trim();
    var isBib = t.indexOf('bibliograph') !== -1;

    // 1. Public Administration
    if (t.indexOf('public admin') !== -1 || t.indexOf('administration') !== -1 || t.indexOf('administrative') !== -1) {
      var isReport = t.indexOf('annual report') !== -1 || t.indexOf('report') !== -1;
      var isIndia = t.indexOf('india') !== -1 || t.indexOf('indian') !== -1;
      var isInst = t.indexOf('institute') !== -1 || t.indexOf('institution') !== -1 || t.indexOf('society') !== -1;

      var u = '35';
      var d = '351';
      var ub = '35: Public Administration';
      var db = '351: Public Administration';

      if (isIndia) {
        u += '(540)';
        d += '.54';
        ub += '; (540): India';
        db += '; Area 54: India';
      }
      if (isInst) {
        u += ':061.2';
        ub += '; :061.2: Institutes / Non-governmental organizations';
      }
      if (isReport) {
        u += '(058)';
        d += '05';
        ub += '; (058): Annual report / Yearbooks';
        db += '; T1--05: Serial publications / Reports';
      }

      return {
        udcNumber: u,
        ddcNumber: d,
        mainSubject: 'Public Administration',
        subSubject: rawTitle,
        udcBreakdown: ub,
        ddcBreakdown: db
      };
    }

    // 2. Scientists, Biographies, Speeches
    if (t.indexOf('scientist') !== -1 || (t.indexOf('science') !== -1 && (t.indexOf('biograph') !== -1 || t.indexOf('speech') !== -1 || t.indexOf('life') !== -1))) {
      var isSpeech = t.indexOf('speech') !== -1 || t.indexOf('lecture') !== -1 || t.indexOf('research') !== -1;
      var placeU = t.indexOf('india') !== -1 ? '(540)' : '';
      var formU = isSpeech ? '(042)' : '';
      return {
        udcNumber: '929:5' + placeU + formU,
        ddcNumber: t.indexOf('india') !== -1 ? '509.254' : '509.2',
        mainSubject: 'Science / Biographies of Scientists',
        subSubject: rawTitle,
        udcBreakdown: ('929: Biography; :5: Pure Science; ' + (placeU ? placeU + ': India; ' : '') + (formU ? formU + ': Speeches' : '')).trim(),
        ddcBreakdown: '509.254: Scientists of India (DDC 23)'
      };
    }

    // 3. Manuscripts, Library Preservation, Libraries
    if (t.indexOf('manuscript') !== -1 || t.indexOf('preservation') !== -1 || t.indexOf('library') !== -1 || t.indexOf('librar') !== -1) {
      if (t.indexOf('preservation') !== -1 || t.indexOf('manuscript') !== -1) {
        return {
          udcNumber: '025.85:091:027.7',
          ddcNumber: '025.84',
          mainSubject: 'Library Science / Preservation',
          subSubject: rawTitle,
          udcBreakdown: '025.85: Preservation and repair; :091: Manuscripts; :027.7: University libraries',
          ddcBreakdown: '025.84: Maintenance and preservation of library collections (DDC 23)'
        };
      }
      return {
        udcNumber: '02',
        ddcNumber: '020',
        mainSubject: 'Library & Information Science',
        subSubject: rawTitle,
        udcBreakdown: '02: Librarianship',
        ddcBreakdown: '020: Library & information sciences'
      };
    }

    // 4. Punjabi Language
    if (t.indexOf('punjabi') !== -1 || t.indexOf('panjabi') !== -1) {
      var u = '809.142.2', d = '491.42', m = 'Punjabi Language';
      if (t.indexOf('welfare') !== -1 || t.indexOf('social') !== -1) {
        u += ':36'; m += ' and Social Welfare';
      }
      return {
        udcNumber: isBib ? ('016:' + u) : u,
        ddcNumber: isBib ? ('016.' + d) : d,
        mainSubject: isBib ? ('Bibliography / ' + m) : m,
        subSubject: rawTitle,
        udcBreakdown: (isBib ? '016: Bibliographies; ' : '') + '809.142.2: Punjabi; :36: Social welfare',
        ddcBreakdown: (isBib ? '016.' : '') + d + ': Languages and Social Services'
      };
    }

    // 5. Social Welfare
    if (t.indexOf('social welfare') !== -1 || t.indexOf('welfare') !== -1 || t.indexOf('social service') !== -1) {
      return {
        udcNumber: isBib ? '016:36' : '36',
        ddcNumber: isBib ? '016.361' : '361',
        mainSubject: isBib ? 'Bibliography / Social Welfare' : 'Social Welfare',
        subSubject: rawTitle,
        udcBreakdown: (isBib ? '016: Bibliographies; ' : '') + '36: Social relief and welfare',
        ddcBreakdown: isBib ? '016.361: Social problems and services' : '361: Social problems'
      };
    }

    // 6. Hindi Literature / Novels
    if (t.indexOf('hindi') !== -1 || t.indexOf('karam') !== -1 || t.indexOf('madhushala') !== -1 || t.indexOf('prem') !== -1) {
      var isNovel = t.indexOf('novel') !== -1 || t.indexOf('fiction') !== -1 || t.indexOf('karam') !== -1;
      var formU = isNovel ? '-31' : '-1';
      var formD = isNovel ? '3' : '1';
      var author = (t.indexOf('prem chand') !== -1 || t.indexOf('premchand') !== -1 || t.indexOf('karam') !== -1) ? 'Premchand' : (t.indexOf('bachchan') !== -1 ? 'Bachchan' : '');
      var work = (t.indexOf('karam') !== -1 || t.indexOf('bhumi') !== -1) ? '"Karmabhumi"' : (t.indexOf('madhu') !== -1 ? '"Madhushala"' : '');
      return {
        udcNumber: '891.43' + formU + author + work,
        ddcNumber: '891.43' + formD,
        mainSubject: 'Hindi Literature / Fiction',
        subSubject: rawTitle,
        udcBreakdown: ('891.43: Hindi Literature; ' + formU + ': Form; ' + (author ? author + ': Author; ' : '') + (work ? work + ': Title' : '')).trim(),
        ddcBreakdown: '891.43' + formD + ': Hindi Fiction'
      };
    }

    // 7. Agriculture / Crops
    if (t.indexOf('wheat') !== -1 || t.indexOf('maize') !== -1 || t.indexOf('harvest') !== -1 || t.indexOf('agricultur') !== -1 || t.indexOf('crop') !== -1) {
      if (t.indexOf('wheat') !== -1 || t.indexOf('maize') !== -1 || t.indexOf('harvest') !== -1) {
        return {
          udcNumber: '633.11+633.15:631.55',
          ddcNumber: '633.1045',
          mainSubject: 'Agriculture / Field Crops',
          subSubject: rawTitle,
          udcBreakdown: '633.11: Wheat; +633.15: Maize; :631.55: Harvesting',
          ddcBreakdown: '633.1045: Cereals Harvesting (DDC 23)'
        };
      }
      return {
        udcNumber: '63',
        ddcNumber: '630',
        mainSubject: 'Agriculture',
        subSubject: rawTitle,
        udcBreakdown: '63: Agriculture, Forestry, Stockbreeding',
        ddcBreakdown: '630: Agriculture and related technologies'
      };
    }

    // 8. Computers & Programming
    if (t.indexOf('computer') !== -1 || t.indexOf('software') !== -1 || t.indexOf('programm') !== -1) {
      return {
        udcNumber: '681.3.06',
        ddcNumber: '005.1',
        mainSubject: 'Computer Science',
        subSubject: rawTitle,
        udcBreakdown: '681.3: Computers; .06: Programs/Software',
        ddcBreakdown: '005.1: Computer programming (DDC 23)'
      };
    }

    // 9. Economics & Commerce
    if (t.indexOf('economic') !== -1 || t.indexOf('finance') !== -1 || t.indexOf('commerce') !== -1 || t.indexOf('trade') !== -1) {
      return {
        udcNumber: '33',
        ddcNumber: '330',
        mainSubject: 'Economics',
        subSubject: rawTitle,
        udcBreakdown: '33: Political Economy, Economics',
        ddcBreakdown: '330: Economics'
      };
    }

    // 10. Education
    if (t.indexOf('educat') !== -1 || t.indexOf('school') !== -1 || t.indexOf('teach') !== -1 || t.indexOf('universit') !== -1) {
      return {
        udcNumber: '37',
        ddcNumber: '370',
        mainSubject: 'Education',
        subSubject: rawTitle,
        udcBreakdown: '37: Education, Teaching',
        ddcBreakdown: '370: Education'
      };
    }

    // 11. Law
    if (t.indexOf('law') !== -1 || t.indexOf('legal') !== -1 || t.indexOf('court') !== -1) {
      return {
        udcNumber: '34',
        ddcNumber: '340',
        mainSubject: 'Law',
        subSubject: rawTitle,
        udcBreakdown: '34: Jurisprudence, Law',
        ddcBreakdown: '340: Law'
      };
    }

    // 12. Philosophy, Logic, Ethics
    if (t.indexOf('philosoph') !== -1 || t.indexOf('logic') !== -1 || t.indexOf('ethic') !== -1) {
      var u = t.indexOf('logic') !== -1 ? '16' : (t.indexOf('ethic') !== -1 ? '17' : '1');
      var d = t.indexOf('logic') !== -1 ? '160' : (t.indexOf('ethic') !== -1 ? '170' : '100');
      return {
        udcNumber: u,
        ddcNumber: d,
        mainSubject: 'Philosophy',
        subSubject: rawTitle,
        udcBreakdown: u + ': Philosophy / Systematic concepts',
        ddcBreakdown: d + ': Philosophy & related disciplines'
      };
    }

    // 13. Biography
    if (t.indexOf('biograph') !== -1 || t.indexOf('prominent') !== -1) {
      var placeU = t.indexOf('india') !== -1 ? '(540)' : '';
      var timeU = (t.indexOf('20th') !== -1 || t.indexOf('twentieth') !== -1) ? '"19"' : '';
      return {
        udcNumber: '929' + placeU + timeU,
        ddcNumber: placeU ? '920.054' : '920',
        mainSubject: 'Collective Biography',
        subSubject: rawTitle,
        udcBreakdown: ('929: Biography; ' + (placeU ? placeU + ': India; ' : '') + (timeU ? timeU + ': 20th Century' : '')).trim(),
        ddcBreakdown: '920.054: Collective biography of India'
      };
    }

    // 14. History
    if (t.indexOf('history') !== -1 || t.indexOf('war') !== -1 || t.indexOf('revolut') !== -1) {
      var placeU = t.indexOf('india') !== -1 ? '(540)' : '';
      return {
        udcNumber: '93/99' + placeU,
        ddcNumber: placeU ? '954' : '900',
        mainSubject: 'History',
        subSubject: rawTitle,
        udcBreakdown: '93/99: History; ' + (placeU ? placeU + ': India' : ''),
        ddcBreakdown: placeU ? '954: History of India' : '900: History'
      };
    }

    return {
      udcNumber: '0/9',
      ddcNumber: '000',
      mainSubject: 'General & Interdisciplinary Works',
      subSubject: rawTitle,
      udcBreakdown: '0/9: Universal classification',
      ddcBreakdown: '000: Computer science, information & general works'
    };
  }

  function displayResult(data, text) {
    document.getElementById('recognizedTitle').innerText = text;
    document.getElementById('udcValue').innerText = data.udcNumber || data.fullNotation || data.answer || '-';
    document.getElementById('udcBreakdown').innerText = data.udcBreakdown || data.breakdown || '';
    document.getElementById('ddcValue').innerText = data.ddcNumber || data.ddc || '-';
    document.getElementById('ddcBreakdown').innerText = data.ddcBreakdown || '';
    document.getElementById('mainSubject').innerText = data.mainSubject || '-';
    document.getElementById('resultCard').style.display = 'flex';
  }

  function classify() {
    var inputElem = document.getElementById('titleInput');
    var text = inputElem ? inputElem.value.trim() : '';
    if (!text) {
      alert("Please enter a title!");
      return;
    }

    var btn = document.getElementById('classifyBtn');
    btn.innerText = "CLASSIFYING...";
    btn.disabled = true;

    var answered = false;

    // Fast client fallback within 1 second to prevent hanging
    var fallbackTimer = setTimeout(function() {
      if (!answered) {
        answered = true;
        var localData = clientSideRuleEngine(text);
        displayResult(localData, text);
        btn.innerText = "CLASSIFY NOW";
        btn.disabled = false;
      }
    }, 1000);

    fetch('/api/classify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: text })
    })
    .then(function(res) {
      clearTimeout(fallbackTimer);
      if (res.ok) return res.json();
      throw new Error('Server returned non-200');
    })
    .then(function(data) {
      if (!answered) {
        answered = true;
        if (data.udcNumber === '001' || data.udcNumber === '0/9') {
          var localAttempt = clientSideRuleEngine(text);
          if (localAttempt.udcNumber !== '0/9') {
            displayResult(localAttempt, text);
            btn.innerText = "CLASSIFY NOW";
            btn.disabled = false;
            return;
          }
        }
        displayResult(data, text);
        btn.innerText = "CLASSIFY NOW";
        btn.disabled = false;
      }
    })
    .catch(function() {
      clearTimeout(fallbackTimer);
      if (!answered) {
        answered = true;
        displayResult(clientSideRuleEngine(text), text);
        btn.innerText = "CLASSIFY NOW";
        btn.disabled = false;
      }
    });
  }
</script>

</body>
</html>
